name: Recetas y objetos

on:
  schedule:
    - cron: "41 4 * * 1"   # los lunes a las 4:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  estaticos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar profesiones, recetas y objetos
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: ${{ vars.REGION || 'eu' }}
        run: cd recolector && DIR_DATOS=../datos python estaticos.py

      - name: Subir al repositorio
        run: |
          git config user.name "recolector"
          git config user.email "recolector@users.noreply.github.com"
          git add datos/estaticos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Recetas y objetos $(date -u +'%Y-%m-%d')"
          for intento in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
