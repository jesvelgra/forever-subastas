name: Recolector de subastas

on:
  schedule:
    - cron: "23,53 * * * *"   # dos veces por hora (si Blizzard no ha publicado nada nuevo, no hace nada)
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      buscar:
        description: "Diagnóstico: lista JSON de [item, precio_unidad, cantidad] a localizar"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar la descarga anterior
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: estado-

      - name: Descargar y resumir las subastas
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: ${{ vars.REGION || 'eu' }}
          FACCION: ${{ vars.FACCION || 'Alliance' }}
          # 110 = subasta de la Alianza del conjunto JcJ (la de Jesús). 111 es la de Normal.
          CASAS: ${{ vars.CASAS || '110' }}
          BUSCAR: ${{ inputs.buscar }}
        run: python recolector/recolector.py

      - name: Guardar esta descarga para la próxima hora
        if: always() && hashFiles('estado/**') != ''
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Subir los datos al repositorio
        run: |
          git config user.name "recolector"
          git config user.email "recolector@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin datos nuevos"
            exit 0
          fi
          git commit -q -m "Subastas $(date -u +'%Y-%m-%d %H:%M') UTC"
          for intento in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

      - name: Analizar (precios, ventas, mejores horas y recetas)
        run: cd recolector && DIR_BASE=.. CASA=110 python analisis.py

      - name: Publicar los datos para el addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view datos >/dev/null 2>&1 || gh release create datos --title "Datos del addon" \
            --notes "Se actualiza cada hora. El PC descarga Datos.lua de aqui." --latest=false
          gh release upload datos addon/ForeverSubastas/Datos.lua addon/ForeverSubastas/Nucleo.lua datos/analisis/recetas.csv --clobber
